name: AI Interviewer Pro Production CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  backend-test-suite:
    name: FastAPI & AI Engine Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python 3.11 Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1 libglx-mesa0 libsndfile1

      - name: Install Python Package Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r backend/requirements.txt

      - name: Execute Pytest Suite
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          pytest

  frontend-build-check:
    name: Next.js Frontend Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20 Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node Modules
        run: |
          npm ci || npm install --legacy-peer-deps

      - name: Compile Next.js Production App
        run: |
          npm run build

  docker-container-audit:
    name: Docker Image Build Audit
    runs-on: ubuntu-latest
    needs: [backend-test-suite, frontend-build-check]
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Audit Backend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          push: false
          tags: ai-interviewer-backend:latest

      - name: Audit Frontend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: false
          tags: ai-interviewer-frontend:latest
