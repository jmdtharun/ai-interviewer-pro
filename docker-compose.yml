version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: ai_interviewer_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ai_interviewer_db
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: ai_interviewer_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - DATABASE_NAME=ai_interviewer_db
      - SECRET_KEY=super-secret-key-ai-interviewer-pro-2026
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ENVIRONMENT=development
    depends_on:
      - mongodb
    volumes:
      - ./reports:/app/reports
      - ./uploads:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: ai_interviewer_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXTAUTH_SECRET=super-secret-nextauth-key-2026
      - NEXTAUTH_URL=http://localhost:3000
    depends_on:
      - backend

volumes:
  mongo_data:
